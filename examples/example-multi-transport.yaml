# gwst 完整配置示例
# 涵盖所有传输层类型（websocket / tcp / quic）及认证加密配置
#
# 传输层（transport）:
#   websocket  WebSocket over HTTP/HTTPS，默认值，穿透性最强
#   tcp        直接 TCP 流，延迟更低
#   quic       QUIC over UDP，必须启用 TLS


# ─────────────────────────────────────────────
# WebSocket 传输（默认）
# ─────────────────────────────────────────────

# WebSocket 服务端
- is_client: false
  listen_addr: ":8000"
  target_addr: "localhost:80"
  path: "/ws"
  transport: "websocket"             # 可省略，默认为 websocket
  key: "my-auth-secret"              # X-Key 认证头，用于访问控制
  encryption_key: "1234567890123456" # 独立数据加密密钥（推荐，16 字节）
  # encryption_algo: "aegis-128l"    # 加密算法（可选）：aegis-128l（默认）/ aegis-128x2 / aegis-128x4
  tls: true
  cert_file: "cert.pem"
  key_file: "key.pem"
  server_name: "example.com"

# WebSocket 客户端
- is_client: true
  listen_addr: ":9000"
  target_addr: "127.0.0.1:8000"
  host: "example.com"
  path: "/ws"
  transport: "websocket"
  key: "my-auth-secret"              # 必须与服务端相同
  encryption_key: "1234567890123456" # 必须与服务端相同
  # encryption_algo: "aegis-128l"    # 必须与服务端相同（空 = aegis-128l）
  tls: true
  server_name: "example.com"
  insecure: true                     # 跳过证书验证（不推荐生产环境）
  # ca_cert_file: "cert.pem"         # 替代 insecure: true；指定服务端自签证书或签发它的 CA（PEM），更安全


# ─────────────────────────────────────────────
# TCP 传输（无 TLS，适合内网/已有外层加密的场景）
# ─────────────────────────────────────────────

# TCP 服务端
- is_client: false
  listen_addr: ":8001"
  target_addr: "localhost:80"
  transport: "tcp"
  encryption_key: "1234567890123456"
  encryption_algo: "aegis-128x2"     # 指定 AEGIS-128X2；不填则默认 AEGIS-128L
  tls: false

# TCP 客户端
- is_client: true
  listen_addr: ":9001"
  target_addr: "127.0.0.1:8001"
  transport: "tcp"
  encryption_key: "1234567890123456"
  encryption_algo: "aegis-128x2"     # 必须与服务端相同
  tls: false


# ─────────────────────────────────────────────
# TCP + TLS 传输
# ─────────────────────────────────────────────

# TCP+TLS 服务端
- is_client: false
  listen_addr: ":8002"
  target_addr: "localhost:80"
  transport: "tcp"
  key: "my-auth-secret"
  encryption_key: "1234567890123456"
  tls: true
  cert_file: "cert.pem"
  key_file: "key.pem"
  server_name: "example.com"

# TCP+TLS 客户端
- is_client: true
  listen_addr: ":9002"
  target_addr: "127.0.0.1:8002"
  transport: "tcp"
  key: "my-auth-secret"
  encryption_key: "1234567890123456"
  tls: true
  server_name: "example.com"
  insecure: true                     # 跳过证书验证（不推荐生产环境）
  # ca_cert_file: "cert.pem"         # 替代 insecure: true；指定服务端自签证书或签发它的 CA（PEM），更安全


# ─────────────────────────────────────────────
# QUIC 传输（必须启用 TLS）
# ─────────────────────────────────────────────

# QUIC 服务端
- is_client: false
  listen_addr: ":8003"
  target_addr: "localhost:80"
  transport: "quic"
  key: "my-auth-secret"
  encryption_key: "1234567890123456"
  tls: true
  cert_file: "cert.pem"
  key_file: "key.pem"
  server_name: "example.com"
  # QUIC 连接参数（可选，0 或不填 = quic-go 默认值）
  # ── 流控窗口（适合高 BDP 或大量并发流的场景）──
  # 默认: stream 512 KB / 6 MB，conn 512 KB / 15 MB
  # quic_initial_stream_receive_window: 8388608   # 8 MB
  # quic_max_stream_receive_window:     8388608   # 8 MB
  # quic_initial_conn_receive_window:   20971520  # 20 MB
  # quic_max_conn_receive_window:       20971520  # 20 MB
  # ── 连接行为 ──
  # quic_max_idle_timeout: 30s          # 最大空闲超时（0 不填 = quic-go 内置默认 30s）；两端协商取较小值
  # quic_max_incoming_streams: 1024     # 对端最多可开的双向流数（默认 100）；仅服务端有效
  # quic_initial_packet_size: 1452      # 初始 UDP 包大小（字节），同时作为 BBR 拥塞控制的初始 datagram 大小
                                        # 0 或不填 = 1452（标准以太网最大无分片值）
                                        # 取值范围 [1200, 1452]；超出范围自动夹边
                                        # 跨公网建议 1200（保守），局域网/loopback 建议 1452（默认，减少包数）
  # quic_disable_path_mtu_discovery: false  # 禁用 PMTU 探测（默认 false = 启用）
                                            # 禁用后发包大小固定为 quic_initial_packet_size
  # ── 拥塞控制（可选，各端独立配置，互不影响）──
  # quic_congestion_type: bbr          # 拥塞控制算法：bbr（默认）/ reno
  # quic_bbr_profile: standard         # BBR 预设（仅 bbr 有效）：standard（默认）/ conservative / aggressive

# QUIC 客户端
- is_client: true
  listen_addr: ":9003"
  target_addr: "127.0.0.1:8003"
  transport: "quic"
  key: "my-auth-secret"
  encryption_key: "1234567890123456"
  tls: true
  server_name: "example.com"
  insecure: true                     # 跳过证书验证（不推荐生产环境）
  # ca_cert_file: "cert.pem"         # 替代 insecure: true；指定服务端自签证书或签发它的 CA（PEM），更安全
  # 客户端窗口与服务端各自独立配置，两端无需相同
  # quic_initial_stream_receive_window: 8388608
  # quic_max_stream_receive_window:     8388608
  # quic_initial_conn_receive_window:   20971520
  # quic_max_conn_receive_window:       20971520
  # quic_max_idle_timeout: 30s
  # quic_initial_packet_size: 1452      # 客户端与服务端各自独立配置，两端无需相同
                                        # 取值范围 [1200, 1452]，0 或不填 = 1452
  # quic_disable_path_mtu_discovery: false
  # quic_congestion_type: bbr          # 拥塞控制算法：bbr（默认）/ reno
  # quic_bbr_profile: standard         # BBR 预设（仅 bbr 有效）：standard（默认）/ conservative / aggressive


# ─────────────────────────────────────────────
# 端口范围监听
# ─────────────────────────────────────────────
# listen_addr 支持端口范围语法 "host:start-end"，会在 [start, end] 每个端口上
# 各自独立监听，互不影响（等价于在配置文件中写 N 个独立 endpoint）。
# 三种传输层均支持，支持 IPv4 / IPv6。
#
# 格式: "<host>:<startPort>-<endPort>"
#   <startPort> 和 <endPort> 必须是 1–65535 的整数，且 startPort ≤ endPort
#   <host> 为空表示监听所有网卡（与 ":port" 相同），支持 IPv4 / IPv6

# 端口范围服务端（TCP，无 TLS）
- is_client: false
  listen_addr: ":8010-8019"          # 同时监听 8010–8019 共 10 个端口
  target_addr: "localhost:80"
  transport: "tcp"
  encryption_key: "1234567890123456"
  encryption_algo: "aegis-128l"
  tls: false

# 端口范围服务端（WebSocket，带认证）
- is_client: false
  listen_addr: ":8020-8029"          # 同时监听 8020–8029 共 10 个端口，每个端口独立
  target_addr: "localhost:80"
  path: "/ws"
  transport: "websocket"
  key: "my-auth-secret"
  tls: false

# IPv6 端口范围服务端
- is_client: false
  listen_addr: "[::]:8030-8039"      # IPv6 地址同样支持端口范围
  target_addr: "localhost:80"
  transport: "tcp"
  tls: false


# ─────────────────────────────────────────────
# 配置说明
# ─────────────────────────────────────────────
#
# key（认证）:
#   通过 X-Key HTTP 头传输，用于服务端访问控制；任意长度
#   若未设置 encryption_key 且 key >= 16 字节，会用 key 前 16 字节加密（不推荐）
#
# encryption_key（加密，推荐）:
#   独立的数据加密密钥，至少 16 字节，客户端与服务端必须完全相同
#   优先级高于 key，两者可独立设置
#
# encryption_algo（可选，默认 aegis-128l）:
#   指定加密算法变体，客户端与服务端必须完全相同：
#     aegis-128l  — 原版 AEGIS-128L（默认，兼容最广）
#     aegis-128x2 — 2 通道并行版本，在支持 AVX-512 的 CPU 上性能更高
#     aegis-128x4 — 4 通道并行版本，在支持 AVX-512 的 CPU 上性能最高
#   注意：不同算法产生的密文互不兼容，两端必须保持一致
#
# quic_*_receive_window（QUIC 窗口，可选）:
#   仅对 transport: quic 有效，其他传输类型忽略
#   客户端和服务端独立生效，两端无需相同，第三方客户端不设置时不影响连通性
#   0 或不填 = quic-go 内置默认值，原有行为完全不变
#   调大窗口可提升高延迟链路吞吐，代价是每条连接占用更多内存
#
# quic_max_idle_timeout（可选）:
#   QUIC 连接最大空闲超时，两端协商取较小值；0 不填 = quic-go 内置默认 30s
#   格式: 30s / 1m / 2m 等 Go duration 字符串；建议不低于 KeepAlivePeriod（30s）
#
# quic_max_incoming_streams（可选，仅服务端有效）:
#   服务端允许单条连接上对端同时开启的最大双向流数，默认 100
#   调大后可支持更多并发隧道复用同一 QUIC 连接
#
# quic_initial_packet_size（可选）:
#   初始 UDP 包大小（字节），同时用于初始化 BBR 拥塞控制的 datagram 大小
#   取值范围 [1200, 1452]，超出范围会自动夹边；0 或不填 = 默认值 1452
#   1452 = 1500（标准以太网 MTU）- 20（IPv4）- 8（UDP）- 20（QUIC 开销）
#   跨公网/不确定路径建议配置 1200（QUIC 规范最小值，任何路径均可通过）
#   局域网/loopback 建议保持 1452（减少同等数据量所需的 UDP 包数）
#   启用 PMTU 探测时此值为探测起点；禁用时则固定为此大小
#
# quic_disable_path_mtu_discovery（可选）:
#   是否禁用路径 MTU 探测（RFC 8899），默认 false（启用探测）
#   禁用后发包大小固定为 quic_initial_packet_size
#
# quic_congestion_type（可选，仅 transport: quic 有效）:
#   QUIC 拥塞控制算法，各端独立配置，互不影响，无需两端相同
#     bbr   — Google BBR v1（默认）
#     reno  — New Reno（quic-go 内置默认控制器，更保守）
#
# quic_bbr_profile（可选，仅 quic_congestion_type: bbr 有效）:
#   BBR 行为预设，各端独立配置
#     standard     — 标准预设（默认）
#     conservative — 更保守：降低峰值增益、开启过冲检测、减少窗口，适合共享/受限链路
#     aggressive   — 更激进：提高峰值增益、延长慢启动、增大窗口，适合低竞争高带宽链路
#
# ca_cert_file（客户端可选）:
#   客户端信任的 CA 证书文件路径（PEM 格式），可直接填服务端自签证书
#   设置后无需 insecure: true 即可安全连接自签证书服务端
