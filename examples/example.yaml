# Server configuration
- is_client: false
  listen_addr: ":8000"
  target_addr: "localhost:80"
  path: "/ws"
  key: "123456"
  tls: true
  cert_file: ""
  key_file: ""
  server_name: "www.microsoft.com"

# Client configuration
- is_client: true
  listen_addr: ":9090"
  load_balance: true
  target_addr: "127.0.0.1:8080"
  fallback_addrs:
    - "127.0.0.1:8083"
    - "127.0.0.1:8082"
  host: "www.microsoft.com"
  path: "/ws"
  key: "123456"
  tls: true
  server_name: "www.microsoft.com"
  insecure: true       # 跳过证书验证（不推荐生产环境）
  # ca_cert_file: "server.crt"  # 替代 insecure: true；指定服务端自签证书或 CA，更安全

# Another server configuration (without TLS)
- is_client: false
  listen_addr: ":8081"
  target_addr: "localhost:8000"
  fallback_addrs:
    - "localhost:8001"
    - "localhost:8002"
  path: "/websocket"

# Another client configuration (without TLS)
- is_client: true
  listen_addr: ":9091"
  target_addr: "localhost:8081"
  host: "localhost"
  path: "/websocket"
